name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libltdl-dev libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev
          sudo apt install -y libncursesw5-dev libreadline-dev liblzma-dev zlib1g-dev libgdbm-dev uuid-dev tk-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Build APK
        run: |
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HK-Apple-Monitor-APK
          path: bin/*.apk
